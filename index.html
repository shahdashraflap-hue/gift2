<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة جداً 🔒</title>
    <style>
        body {
            background: linear-gradient(135deg, #001D39, #49769F);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .login-box {
            background: #BDD8E9;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #0A4174;
            box-sizing: border-box;
        }
        h2 { color: #001D39; margin-bottom: 10px; font-size: 1.4rem; }
        .hint {
            color: #0A4174; font-size: 0.85rem; margin-bottom: 25px;
            background: rgba(123, 189, 232, 0.3); padding: 8px 12px; border-radius: 10px; display: inline-block;
            font-weight: bold;
        }
        input[type="password"] {
            width: 90%; padding: 12px 15px; border: 2px solid #6EA2B3;
            border-radius: 25px; font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
            box-sizing: border-box; background-color: #fff; color: #001D39;
        }
        input[type="password"]:focus { border-color: #0A4174; box-shadow: 0 0 8px rgba(10, 65, 116, 0.3); }
        button {
            background-color: #0A4174; color: #BDD8E9; border: none; padding: 12px 30px;
            font-size: 1rem; border-radius: 25px; cursor: pointer; margin-top: 20px; transition: 0.3s; width: 90%;
            font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        button:hover { background-color: #001D39; }
        .message { margin-top: 15px; font-size: 1rem; font-weight: bold; min-height: 24px; }
        .error { color: #780000; }
        .success { color: #001D39; }

        @media (max-width: 360px) {
            h2 { font-size: 1.2rem; }
            button { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 I need a login password</h2>
        <div class="hint">💡 Hint: Something you love saying to me. 😉</div>
        <br>
        <input type="password" id="passwordInput" placeholder="....Write the password here in Arabic">
        <br>
        <button onclick="checkPassword()">Log In</button>
        <div id="msg" class="message"></div>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("passwordInput").value;
            const msg = document.getElementById("msg");
            if (password === "شهوذه") {
                msg.className = "message success";
                msg.innerText = "Let's go!  😍🎉";
                setTimeout(() => { window.location.href = "page2.html"; }, 1000);
            } else {
                msg.className = "message error";
                msg.innerText = "  No, not that one 😢💔";
            }
        }
    </script>
</body>
</html>
